name: Publish ZKPassport SDK

on:
  push:
    branches: [main]
    paths:
      - packages/zkpassport-sdk/package.json

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version_check.outputs.publish }}
      version: ${{ steps.version_check.outputs.version }}
      beta: ${{ steps.version_check.outputs.beta }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: packages/zkpassport-sdk/package.json
          sparse-checkout-cone-mode: false

      - name: Check if version is published to npm
        id: version_check
        run: |
          VERSION=$(jq -r .version packages/zkpassport-sdk/package.json)
          if ! npm view "@zkpassport/sdk@$VERSION" version 2>/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              echo "beta=true" >> "$GITHUB_OUTPUT"
            else
              echo "beta=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  publish:
    name: Publish SDK
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.check.outputs.beta == 'true' && 'npm-publish-beta' || 'npm-publish' }}
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure workspace dependencies are synced
        run: bash scripts/sync-workspace-deps.sh check

      - name: Install system dependencies
        run: sudo apt-get install -y lsof jq zsh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Install Foundry dependencies
        run: forge install
        working-directory: packages/registry-contracts

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build package
        run: bun run build --filter=@zkpassport/sdk

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify version matches the check job
        env:
          EXPECTED_VERSION: ${{ needs.check.outputs.version }}
          BETA: ${{ needs.check.outputs.beta }}
        run: |
          VERSION=$(node -p "require('./packages/zkpassport-sdk/package.json').version")
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Version $VERSION does not match checked version $EXPECTED_VERSION"
            exit 1
          fi
          if [[ "$BETA" == "true" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::Refusing to publish non-beta version $VERSION without approval"
            exit 1
          fi

      - name: Publish new version to npm
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ../../scripts/prepublish.sh
          PKG=$(bun pm pack --quiet | xargs)
          if [[ "$VERSION" =~ [0-9]+\.[0-9]+\.[0-9]+\- ]]; then
            npm publish "$PKG" --ignore-scripts --provenance --access public --tag beta
          else
            npm publish "$PKG" --ignore-scripts --provenance --access public
          fi
        working-directory: packages/zkpassport-sdk
