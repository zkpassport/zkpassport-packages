name: Publish ZKPassport UI

on:
  push:
    branches: [main]
    paths:
      - packages/zkpassport-ui/package.json
  workflow_dispatch:

jobs:
  publish:
    name: Publish UI
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure workspace dependencies are synced
        run: bash scripts/sync-workspace-deps.sh check

      - name: Install system dependencies
        run: sudo apt-get install -y lsof jq zsh

      # Foundry is required by the later "Publish" step, not the filtered
      # build below: scripts/prepublish.sh runs `bun run build` workspace-wide,
      # which invokes `forge build` in packages/registry-contracts.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Install Foundry dependencies
        run: forge install
        working-directory: packages/registry-contracts

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build package
        run: bun run build --filter=@zkpassport/ui

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version is published to npm
        id: version_check
        run: |
          VERSION=$(node -p "require('./packages/zkpassport-ui/package.json').version")
          if ! npm view @zkpassport/ui@$VERSION version 2>/dev/null; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Publish new version to npm
        if: steps.version_check.outputs.publish == 'true'
        run: |
          ../../scripts/prepublish.sh
          PKG=$(bun pm pack --quiet | xargs)
          if [[ "${{ steps.version_check.outputs.version }}" =~ [0-9]+\.[0-9]+\.[0-9]+\- ]]; then
            npm publish "$PKG" --ignore-scripts --provenance --access public --tag beta
          else
            npm publish "$PKG" --ignore-scripts --provenance --access public
          fi
        working-directory: packages/zkpassport-ui

      # The script-tag bundle goes to cdn.zkpassport.id twice: an immutable copy at its exact
      # version, and a channel copy at its major version that every stable release overwrites.
      # Skipped until the AWS_CDN_* variables are configured.
      - name: Configure AWS credentials
        if: steps.version_check.outputs.publish == 'true' && vars.AWS_CDN_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CDN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_CDN_REGION }}

      - name: Upload script-tag bundle to the CDN
        if: steps.version_check.outputs.publish == 'true' && vars.AWS_CDN_BUCKET != ''
        env:
          VERSION: ${{ steps.version_check.outputs.version }}
          BUCKET: ${{ vars.AWS_CDN_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.AWS_CDN_DISTRIBUTION_ID }}
        run: |
          upload() {
            aws s3 cp dist/ui.js "s3://$BUCKET/ui/$1/ui.js" \
              --content-type application/javascript --cache-control "$2"
            aws s3 cp dist/ui.js.map "s3://$BUCKET/ui/$1/ui.js.map" \
              --content-type application/json --cache-control "$2"
          }
          upload "$VERSION" "public, max-age=31536000, immutable"
          if [[ ! "$VERSION" =~ - ]]; then
            MAJOR="v${VERSION%%.*}"
            upload "$MAJOR" "public, max-age=600"
            aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/ui/$MAJOR/*"
          fi
        working-directory: packages/zkpassport-ui
