name: Aztec

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    # Unlike the other workflows, scope to our paths: the Aztec toolchain
    # install is too heavy to run on every unrelated PR.
    paths:
      - "packages/aztec/**"
      - ".github/workflows/aztec.yml"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The aztec dep tag in Nargo.toml is the single source of truth for the
      # toolchain version.
      - name: Extract Aztec version
        id: aztec-version
        run: |
          VERSION=$(sed -n 's/.*tag = "v\([0-9][0-9.]*\)".*/\1/p' packages/aztec/zkpassport.nr/zkpassport_registry_contract/Nargo.toml | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Aztec toolchain
        id: aztec-cache
        uses: actions/cache@v4
        with:
          path: ~/.aztec
          key: aztec-${{ runner.os }}-${{ steps.aztec-version.outputs.version }}

      - name: Install Aztec toolchain
        if: steps.aztec-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.aztec-version.outputs.version }}
        run: |
          export CI=1
          curl -fsSL "https://install.aztec.network/${VERSION}/install" | bash

      - name: Add Aztec to PATH
        run: |
          V="${{ steps.aztec-version.outputs.version }}"
          echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
          echo "$HOME/.aztec/versions/$V/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: aztec-nargo fmt --check
        working-directory: packages/aztec/zkpassport.nr

      - name: Compile contracts
        run: aztec compile
        working-directory: packages/aztec/zkpassport.nr

      - name: Run tests
        run: aztec test
        working-directory: packages/aztec/zkpassport.nr

      # The anchors in zkpassport_core/src/fixtures.nr must mirror the conformance
      # vectors published by @zkpassport/utils (the nargo tests above hold the Noir
      # side to the anchors; the SDK's own suite holds it to the vectors).
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Run commitment conformance tests
        run: bun test packages/aztec/test-harness/fixture-conformance.test.ts packages/aztec/test-harness/fixture-provenance.test.ts

      # Recursion-opcode coverage: nargo test no-ops std::verify_proof, so replay the
      # checked-in disclose proof fixture through bb.
      - name: Run bb recursion harness
        env:
          AZTEC_HOME: /home/runner/.aztec/versions/${{ steps.aztec-version.outputs.version }}
        run: |
          ./run-harness.sh fixtures/outer_count_4_disclose.json
          ! ./run-harness.sh fixtures/outer_count_4_disclose.json --tamper-proof
          ! ./run-harness.sh fixtures/outer_count_4_disclose.json --tamper-public-input
        working-directory: packages/aztec/test-harness
