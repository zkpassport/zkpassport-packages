name: Aztec

on:
  # Unlike the other test workflows, scope to our paths: the Aztec toolchain
  # install is too heavy to run on every unrelated push or PR.
  push:
    branches: [main]
    paths:
      - "packages/aztec/**"
      - ".github/workflows/aztec.yml"
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "packages/aztec/**"
      - ".github/workflows/aztec.yml"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # packages/aztec/.aztecrc is the single source of truth for the toolchain version, the
      # file `aztec-up use` and `aztec-up env` read locally. The aztec-nr and
      # bb_proof_verification tags in the Nargo manifests must name the same release.
      - name: Read Aztec version
        id: aztec-version
        run: |
          VERSION=$(grep -v -e '^#' -e '^$' packages/aztec/.aztecrc | head -n 1 | tr -d '[:space:]')
          test -n "$VERSION"
          stale=$(git ls-files 'packages/aztec/**/Nargo.toml' | xargs grep -n -E 'aztec-nr|aztec-packages' | grep -v -F "tag = \"v$VERSION\"" || true)
          if [ -n "$stale" ]; then
            echo "::error::Nargo tags that do not match packages/aztec/.aztecrc ($VERSION):"
            echo "$stale"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Aztec toolchain
        id: aztec-cache
        uses: actions/cache@v4
        with:
          path: ~/.aztec
          key: aztec-${{ runner.os }}-${{ steps.aztec-version.outputs.version }}

      - name: Install Aztec toolchain
        if: steps.aztec-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.aztec-version.outputs.version }}
        run: |
          export CI=1
          curl -fsSL "https://install.aztec-labs.com/${VERSION}/install" | bash

      - name: Add Aztec to PATH
        run: |
          V="${{ steps.aztec-version.outputs.version }}"
          echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
          echo "$HOME/.aztec/versions/$V/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: aztec-nargo fmt --check
        working-directory: packages/aztec/noir

      - name: Compile contracts
        run: aztec compile
        working-directory: packages/aztec/noir

      - name: Run tests
        run: aztec test
        working-directory: packages/aztec/noir

      # The anchors in core/src/fixtures.nr must mirror the conformance
      # vectors published by @zkpassport/utils (the nargo tests above hold the Noir
      # side to the anchors; the SDK's own suite holds it to the vectors).
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Run commitment conformance tests
        run: bun test packages/aztec/test-harness/fixture-conformance.test.ts

      # Recursion-opcode coverage: nargo test no-ops std::verify_proof, so replay the
      # checked-in disclose proof fixture through bb.
      - name: Run bb recursion harness
        env:
          AZTEC_HOME: /home/runner/.aztec/versions/${{ steps.aztec-version.outputs.version }}
        run: |
          ./test-recursive-verification.sh fixtures/outer_count_4_disclose.json
          ! ./test-recursive-verification.sh fixtures/outer_count_4_disclose.json --tamper-proof
          ! ./test-recursive-verification.sh fixtures/outer_count_4_disclose.json --tamper-public-input
        working-directory: packages/aztec/test-harness

      # The TS companion package embeds the contract artifact from target/,
      # produced by the compile step above.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/aztec/ts/package-lock.json

      - name: Install TS package dependencies
        run: npm ci
        working-directory: packages/aztec/ts

      - name: Typecheck TS package
        run: npm run typecheck
        working-directory: packages/aztec/ts

      - name: Test TS package
        run: npm run test
        working-directory: packages/aztec/ts
