name: E2E

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_call:

jobs:
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # A workflow in another repository that calls this one would otherwise check out its own
        # repository. This repository's runs still check out their ref; callers get main.
        with:
          repository: zkpassport/zkpassport-packages

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache the bb.js CRS
        uses: actions/cache@v4
        with:
          path: ~/.bb-crs
          key: bb-crs-${{ hashFiles('bun.lock') }}
          restore-keys: bb-crs-

      - name: Run the e2e tests
        run: bun run test:e2e
